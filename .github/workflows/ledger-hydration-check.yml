name: Ledger development hydration check
on:
  workflow_dispatch:
  push:
    branches: ['editorial/botn-season-ledger']
    paths: ['components/editorial/SeasonComparison.tsx','scripts/editorial/check-hydration.mjs','.github/workflows/ledger-hydration-check.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: node scripts/editorial/check-hydration.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ledger-hydration-diagnostics
          path: artifacts/hydration/
          retention-days: 3
