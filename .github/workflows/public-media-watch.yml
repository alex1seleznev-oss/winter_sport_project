name: Public media watch
on:
  workflow_dispatch:
  schedule:
    - cron: '19 */6 * * *'
  push:
    branches: ['automation/public-media-watch']
permissions:
  contents: read
concurrency:
  group: public-media-watch
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Deterministic public-source parser tests
        run: node --test tests/public-media-watch.test.mjs
      - name: Read public pages and feeds (no secrets, logins or database writes)
        run: node scripts/media-watch/run.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: public-media-review
          path: artifacts/media-watch/
          retention-days: 3
