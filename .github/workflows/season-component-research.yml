name: Historical race component research
on:
  workflow_dispatch:
  push:
    branches: ['editorial/botn-season-ledger']
    paths: ['scripts/editorial/inspect-components.mjs','.github/workflows/season-component-research.yml']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: node scripts/editorial/inspect-components.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: historical-component-source-evidence
          path: artifacts/component-research/
          retention-days: 7
