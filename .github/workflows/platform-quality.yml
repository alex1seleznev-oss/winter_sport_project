name: Platform quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: platform-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - name: Reproducible installation
        run: npm ci
      - name: Deterministic regression tests
        run: npm test
      - name: Export semantic core
        run: node scripts/export-semantic-core.mjs
      - name: Dependency audit
        run: npm audit --audit-level=high --json > dependency-audit.json
      - name: Production build
        run: npm run build
        env:
          MEDIA_UPLOADS_ENABLED: 'false'
          MEDIA_LEGAL_REVIEW_APPROVED: 'false'
      - name: HTTP and API regression checks
        run: npm run test:http
      - name: Install test browsers
        run: npx --no-install playwright install --with-deps chromium webkit
      - name: Browser tests on desktop Chromium and mobile WebKit
        run: npx --no-install playwright test
      - name: Agent-browser verification of production build
        run: |
          set -euo pipefail
          npx --no-install agent-browser install --with-deps
          npm run start -- -H 127.0.0.1 -p 4174 >/tmp/wsh-browser-server.log 2>&1 &
          server=$!
          trap 'npx --no-install agent-browser --session wsh-ci close || true; kill "$server" || true' EXIT
          for i in $(seq 1 40); do if curl --fail --silent http://127.0.0.1:4174/legal >/dev/null; then break; fi; sleep 1; done
          npx --no-install agent-browser --session wsh-ci open http://127.0.0.1:4174/
          npx --no-install agent-browser --session wsh-ci snapshot -i > artifacts/agent-browser-snapshot.txt
          npx --no-install agent-browser --session wsh-ci screenshot artifacts/screenshots/agent-browser-home.png
        env:
          VERCEL_ENV: preview
          MEDIA_UPLOADS_ENABLED: 'false'
          MEDIA_LEGAL_REVIEW_APPROVED: 'false'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: followthrough-platform-evidence
          path: |
            artifacts/
            dependency-audit.json
            test-results/
          retention-days: 3
  fis-live-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:source
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: followthrough-fis-live-evidence
          path: artifacts/fis-live-contract.json
          retention-days: 3
