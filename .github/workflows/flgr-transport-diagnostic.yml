name: FLGR verified transport diagnostic
on:
  push:
    branches: ['fix/flgr-verified-transport']
    paths:
      - '.github/workflows/flgr-transport-diagnostic.yml'
      - 'scripts/diagnose-flgr-transport.mjs'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: flgr-transport-diagnostic-${{ github.ref }}
  cancel-in-progress: true
jobs:
  diagnose:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node scripts/diagnose-flgr-transport.mjs
      - run: node scripts/diagnose-flgr-transport.mjs
        env:
          NODE_USE_SYSTEM_CA: '1'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: flgr-transport-${{ matrix.os }}
          path: artifacts/flgr-transport-*.json
          retention-days: 7
