name: Real athlete original photographs
on:
  push:
    branches: ['design/fullscreen-athletes']
    paths: ['scripts/visual/research-selected.mjs','.github/workflows/athlete-originals.yml']
permissions:
  contents: read
jobs:
  originals:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: node scripts/visual/research-selected.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: athlete-originals
          path: artifacts/athlete-originals/
          retention-days: 3
