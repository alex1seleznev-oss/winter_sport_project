name: One-time dependency lock and source diagnostic
on:
  push:
    branches: ['automation/quality-followthrough']
    paths: ['package.json', '.github/workflows/bootstrap-lock.yml']
permissions:
  contents: read
jobs:
  prepare:
    if: github.repository == 'alex1seleznev-oss/winter_sport_project'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Resolve exact dependencies without package scripts
        run: npm install --package-lock-only --ignore-scripts
      - name: Install locked diagnostic dependencies without scripts
        run: npm ci --ignore-scripts
      - name: Read-only source and Auth settings diagnostic
        run: node scripts/inspect-upstream.mjs
      - name: Commit generated lock only to this exact branch head
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          repo='alex1seleznev-oss/winter_sport_project'
          branch='automation/quality-followthrough'
          current=$(gh api "repos/$repo/git/ref/heads/$branch" --jq '.object.sha')
          test "$current" = "$EXPECTED_SHA"
          base_tree=$(gh api "repos/$repo/git/commits/$current" --jq '.tree.sha')
          python - <<'PY'
          import base64,json
          json.dump({'content':base64.b64encode(open('package-lock.json','rb').read()).decode(),'encoding':'base64'},open('/tmp/lock-blob.json','w'))
          PY
          blob=$(gh api --method POST "repos/$repo/git/blobs" --input /tmp/lock-blob.json --jq '.sha')
          jq -n --arg base "$base_tree" --arg blob "$blob" '{base_tree:$base,tree:[{path:"package-lock.json",mode:"100644",type:"blob",sha:$blob}]}' >/tmp/lock-tree.json
          tree=$(gh api --method POST "repos/$repo/git/trees" --input /tmp/lock-tree.json --jq '.sha')
          jq -n --arg tree "$tree" --arg parent "$current" '{message:"Commit exact dependency lock for reproducible builds",tree:$tree,parents:[$parent]}' >/tmp/lock-commit.json
          commit=$(gh api --method POST "repos/$repo/git/commits" --input /tmp/lock-commit.json --jq '.sha')
          gh api --method PATCH "repos/$repo/git/refs/heads/$branch" -f sha="$commit" -F force=false
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: followthrough-diagnostics
          path: |
            package-lock.json
            artifacts/upstream-inspection.json
          retention-days: 3
