name: FIS event-detail session monitor
on:
  workflow_dispatch:
  schedule:
    - cron: '41 */12 * * *'
  push:
    branches: [main, 'fix/fis-event-detail-sessions']
    paths:
      - '.github/workflows/fis-event-details.yml'
      - 'scripts/check-fis-event-details.mjs'
      - 'scripts/lib/parse-fis-event-detail.mjs'
      - 'tests/fis-*.test.mjs'
      - 'scripts/lib/reconcile-fis-sessions.mjs'
      - 'data/fis-event-sessions-2627.json'
permissions:
  contents: read
concurrency:
  group: fis-event-details-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify-sessions:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Session identity and review-plan regression tests
        run: node --test tests/fis-*.test.mjs
      - name: Read official season structure and retain evidence
        run: node scripts/check-fis-event-details.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: fis-event-detail-evidence
          path: artifacts/fis-event-*
          retention-days: 30
