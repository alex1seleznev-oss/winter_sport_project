name: Falun official programme evidence
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Capture fixed official documents without database access
        shell: bash
        run: |
          python3 - <<'PY'
          import datetime, hashlib, json, pathlib, urllib.request
          sources = {
            'organizer-en': 'https://falun2027.com/here-is-the-competition-schedule-for-falun-2027/',
            'organizer-sv': 'https://falun2027.com/sv/har-ar-tavlingsprogrammet-pa-falun-2027/',
            'fis-event': 'https://www.fis-ski.com/DB/general/event-details.html?eventid=63107&seasoncode=2027&sectorcode=CC',
            'fis-race': 'https://www.fis-ski.com/DB/general/results.html?raceid=52297&sectorcode=CC',
          }
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  raise ValueError('OFFICIAL_REDIRECT_REQUIRES_REVIEW')
          opener = urllib.request.build_opener(NoRedirect())
          out = pathlib.Path('artifacts/falun-programme')
          out.mkdir(parents=True, exist_ok=True)
          reports = []
          for name, url in sources.items():
              item = {'name': name, 'source_url': url, 'database_writes': False}
              try:
                  req = urllib.request.Request(url, headers={'User-Agent': 'WinterSportsHub/official-programme-review', 'Accept': 'text/html'})
                  with opener.open(req, timeout=25) as response:
                      content_type = response.headers.get('Content-Type', '')
                      if response.status != 200 or 'text/html' not in content_type.lower():
                          raise ValueError('OFFICIAL_HTTP_OR_CONTENT_TYPE_INVALID')
                      body = response.read(2 * 1024 * 1024 + 1)
                      if not body or len(body) > 2 * 1024 * 1024:
                          raise ValueError('OFFICIAL_DOCUMENT_SIZE_INVALID')
                      (out / (name + '.html')).write_bytes(body)
                      item.update(ok=True, http_status=response.status, bytes=len(body), content_type=content_type,
                                  document_sha256=hashlib.sha256(body).hexdigest(),
                                  fetched_at=datetime.datetime.now(datetime.timezone.utc).isoformat(),
                                  tls_verification='required', transport='python_https')
              except Exception as error:
                  item.update(ok=False, error=str(error))
              reports.append(item)
          report = {'mode': 'read_only_official_evidence', 'reports': reports, 'database_writes': False}
          (out / 'manifest.json').write_text(json.dumps(report, indent=2), encoding='utf-8')
          print(json.dumps(report, indent=2))
          if not any(x.get('ok') and x['name'].startswith('organizer-') for x in reports):
              raise SystemExit('NO_CURRENT_ORGANIZER_DOCUMENT')
          if not any(x.get('ok') and x['name'].startswith('fis-') for x in reports):
              raise SystemExit('NO_CURRENT_FIS_DOCUMENT')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: falun-official-programme-evidence
          path: artifacts/falun-programme/
          retention-days: 30
