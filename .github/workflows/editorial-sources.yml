name: Editorial source receipts
on:
  workflow_dispatch:
  push:
    branches: ['editorial/season-202526']
    paths: ['content/editorial/sources.json','scripts/editorial/verify-sources.mjs','.github/workflows/editorial-sources.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/editorial/verify-sources.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: editorial-source-receipts
          path: artifacts/editorial/
          retention-days: 7
