name: Stage photo research
on:
  workflow_dispatch:
  push:
    branches: ['automation/premium-stages']
    paths: ['scripts/inspect-stage-photos.mjs','content/stage-photo-candidates.json','.github/workflows/stage-photo-research.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/inspect-stage-photos.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: original-photo-research
          path: artifacts/photo-research/
          retention-days: 1
