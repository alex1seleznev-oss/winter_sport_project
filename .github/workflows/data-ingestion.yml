name: Winter Sports Read-only Discovery
on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main, 'fix/flgr-verified-transport']
    paths:
      - '.github/workflows/data-ingestion.yml'
      - 'scripts/ingest-flgr.mjs'
      - 'scripts/lib/fetch-*.mjs'
      - 'scripts/lib/parse-flgr.mjs'
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - name: Inspect live official calendar contract
        run: node scripts/inspect-flgr-calendar.mjs
      - name: FLGR source availability, not results ingestion
        run: node scripts/ingest-flgr.mjs
      - name: FIS calendar discovery, not verified publication
        if: ${{ !cancelled() }}
        run: node scripts/ingest-fis-calendar.mjs
      - name: Historical FIS parser control, never a season import
        if: ${{ !cancelled() }}
        run: npm run test:source
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: discovery-evidence
          path: artifacts/
          retention-days: 3
