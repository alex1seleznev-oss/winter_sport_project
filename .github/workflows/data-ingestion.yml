name: Winter Sports Data Ingestion
on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: FLGR discovery and ingestion
        run: node scripts/ingest-flgr.mjs
      - name: FIS calendar discovery
        run: node scripts/ingest-fis-calendar.mjs
      - name: FIS results ingestion
        run: node scripts/ingest-fis.mjs
      - name: Public Telegram intelligence
        run: node scripts/ingest-public-telegram.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
