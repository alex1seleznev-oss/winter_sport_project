name: Official story intake
on:
  schedule:
    - cron: '41 */3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/official-story-intake.yml'
      - 'scripts/agents/official-story-candidate.mjs'
      - 'scripts/agents/prepare-ibu-official-story.mjs'
      - 'scripts/agents/upload-official-story.mjs'
      - 'scripts/lib/fetch-ibu-datacenter.mjs'
      - 'supabase/functions/official-story-intake/**'
      - 'database/proposed/agent_fabric_official_story_intake.sql'
      - 'database/tests/agent-official-story-intake.sql'
permissions:
  contents: read
concurrency:
  group: official-story-intake
  cancel-in-progress: false
jobs:
  intake:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - name: Reproducible installation
        run: npm ci --ignore-scripts
      - name: Verify bounded official-story contracts
        run: node --test tests/official-story-intake.test.mjs tests/fetch-ibu-datacenter.test.mjs tests/fetch-official.test.mjs tests/official-story-upload-contract.test.mjs tests/official-story-edge-contract.test.mjs
      - name: Prepare one rotating IBU World Cup candidate
        run: node scripts/agents/prepare-ibu-official-story.mjs
        env:
          IBU_OBSERVER_RUN_NUMBER: ${{ github.run_number }}
      - name: Upload candidate through GitHub OIDC
        run: node scripts/agents/upload-official-story.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: official-story-intake
          path: artifacts/official-story/
          retention-days: 7
