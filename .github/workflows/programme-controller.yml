name: Programme review controller
on:
  schedule:
    - cron: '31 */6 * * *'
  workflow_dispatch:
  push:
    branches: ['automation/calendar-controller']
permissions:
  contents: read
concurrency:
  group: programme-review-controller
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/run-programme-controller.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: programme-review-packet
          path: artifacts/programme-controller.json
          retention-days: 7
