name: Parser Regression Check
on:
  workflow_dispatch:
  schedule:
    - cron: "41 4 * * 1"
permissions:
  contents: read
jobs:
  parsers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/test-parsers.mjs
